server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

spring:
  application:
    name: mtracker
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mtracker}}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

mtracker:
  region: ${MTRACKER_REGION:eu}
  sync:
    interval-hours: ${MTRACKER_SYNC_INTERVAL_HOURS:6}
    poll-interval-ms: ${MTRACKER_SYNC_POLL_INTERVAL_MS:60000}
    batch-size: ${MTRACKER_SYNC_BATCH_SIZE:10}
    request-delay:
      raider.io: 50
    default-delay: 100
  raiderio:
    base-url: ${RAIDERIO_BASE_URL:https://raider.io/api/v1}
  s2s:
    token: ${MTRACKER_S2S_TOKEN:}
  admin:
    token: ${MTRACKER_ADMIN_TOKEN:}

logging:
  level:
    com.nikichxp.mtracker: ${LOG_LEVEL_MTRACKER:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
