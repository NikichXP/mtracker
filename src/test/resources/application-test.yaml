spring:
  datasource:
    url: jdbc:h2:mem:mtracker;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

mtracker:
  region: eu
  sync:
    interval-hours: 24
    request-delay:
      raider.io: 1
  raiderio:
    stub:
      enabled: true
  wowhead:
    stub:
      enabled: true
  top-gear:
    scheduler-enabled: false
    max-per-spec: 10
    max-pages-per-class: 2
    min-pages-per-class: 1
    scan-batch-size: 5
    max-runs-per-character: 3
  admin:
    token: test-admin-token
  s2s:
    token: test-s2s-token
