spring:
  datasource:
    url: jdbc:h2:mem:mtracker;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

mtracker:
  region: eu
  sync:
    interval-hours: 24
    request-delay:
      raider.io: 1
  raiderio:
    stub:
      enabled: true
  admin:
    token: test-admin-token
  s2s:
    token: test-s2s-token
