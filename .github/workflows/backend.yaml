name: Backend Build and Deploy

on:
  push:
    branches: master
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend.yaml"
  workflow_dispatch:

concurrency:
  group: backend-build-deploy
  cancel-in-progress: false

env:
  REGISTRY: kraken.nikichxp.xyz
  IMAGE: kraken.nikichxp.xyz/mtracker-service
  NAMESPACE: mtracker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          provenance: false
        timeout-minutes: 30

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Write kubeconfig
        shell: bash
        env:
          KUBECONFIG_FILE: ${{ github.workspace }}/.kube/config
        run: |
          mkdir -p "$(dirname "$KUBECONFIG_FILE")"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d -i > "$KUBECONFIG_FILE"
          chmod 600 "$KUBECONFIG_FILE"
          echo "KUBECONFIG=$KUBECONFIG_FILE" >> "$GITHUB_ENV"

      - name: Roll out new image
        shell: bash
        run: |
          set -euo pipefail
          if kubectl -n "$NAMESPACE" get deployment/mtracker-service >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" rollout restart deployment/mtracker-service
            kubectl -n "$NAMESPACE" rollout status deployment/mtracker-service --timeout=300s
          fi

      - name: Cleanup kubeconfig
        if: always()
        shell: bash
        run: rm -f "${{ github.workspace }}/.kube/config"
